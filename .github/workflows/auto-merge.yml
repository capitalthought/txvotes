name: Auto-merge PRs
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          # Pass the PR number explicitly — the action otherwise falls back to
          # `gh pr merge` with no argument and no checkout, which dies with
          # "could not determine current branch". Once enabled, GitHub merges
          # automatically when required checks pass + review is approved.
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: squash
